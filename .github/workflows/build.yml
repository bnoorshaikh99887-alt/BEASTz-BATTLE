name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build APK
        working-directory: ./android-app
        run: gradle assembleDebug

      - name: Prepare APK Release Files
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk BEASTz-BATTLE-v2.7.apk
          cp android-app/app/build/outputs/apk/debug/app-debug.apk BEASTz-BATTLE.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BEASTz-BATTLE-v2.7-APK
          path: |
            BEASTz-BATTLE-v2.7.apk
            BEASTz-BATTLE.apk
            android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Create or Update GitHub Release v2.7
        uses: softprops/action-gh-release@v1
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.7
          name: "BEASTz BATTLE v2.7 (Official Native APK)"
          body: |
            # 🎮 BEASTz BATTLE v2.7 Official Native Release

            Download the new **v2.7** native Android APK for BEASTz BATTLE.

            ### 🚀 What's New in v2.7:
            - **Strict Role Security**: Workers and standard users are blocked from Master Admin Panel.
            - **Worker Studio Redesign**: Clean header with single unified WORKER STUDIO badge; fixed mobile layout overflow.
            - **Dynamic Match Modes & Slots**: Full Free Fire mode matrix (SOLO BR, DUO BR, SQUAD BR, CS 1v1, CS 2v2, CS 4v4, LONE WOLF 1v1, LONE WOLF 2v2) with exact player details validation (1, 2, or 4 players).
            - **Private Tournament Matches**: Host private matches with 6-character access codes (e.g. BTZ-A89F) and 1-tap "Join with Code".
            - **Top-Only Pull-to-Refresh**: Clean swipe down from top screen to reload live tournament data without accidental trigger.
            - **Dual-Mode Visual Contrast**: Complete light/dark mode support with high-contrast text and zero white-on-white glitch.

            ### 📲 Direct Download:
            👉 **[Download BEASTz-BATTLE-v2.7.apk](https://github.com/bnoorshaikh99887-alt/BEASTz-BATTLE/releases/download/v2.7/BEASTz-BATTLE-v2.7.apk)**
          files: |
            BEASTz-BATTLE-v2.7.apk
            BEASTz-BATTLE.apk
            android-app/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Also Update Latest Tag Release
        uses: softprops/action-gh-release@v1
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "BEASTz BATTLE Latest APK (v2.7)"
          body: "Official latest Android APK (v2.7) for BEASTz BATTLE with Role Security, Worker Studio redesign, Dynamic Roster slots, and Private Tournament Codes."
          files: |
            BEASTz-BATTLE-v2.7.apk
            BEASTz-BATTLE.apk
            android-app/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
