name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build APK
        working-directory: ./android-app
        run: gradle assembleDebug

      - name: Prepare APK Release Files
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk BEASTz-BATTLE-v2.5.apk
          cp android-app/app/build/outputs/apk/debug/app-debug.apk BEASTz-BATTLE.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BEASTz-BATTLE-v2.5-APK
          path: |
            BEASTz-BATTLE-v2.5.apk
            BEASTz-BATTLE.apk
            android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Create or Update GitHub Release v2.5
        uses: softprops/action-gh-release@v1
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.5
          name: "BEASTz BATTLE v2.5 (Official Native APK)"
          body: |
            # 🎮 BEASTz BATTLE v2.5 Official Native Release

            Download the new **v2.5** native Android APK for BEASTz BATTLE.

            ### 🚀 What's New in v2.5:
            - **Native Pull-to-Refresh**: Swipe down from top on any screen to reload live tournament data instantly.
            - **Modern Blue & Slate UI Theme**: High-contrast blue gaming interface with sleek glassmorphism.
            - **WebView Cache Auto-Buster**: Flushes stale WebView HTTP cache on upgrade so new features reflect immediately without freezing.
            - **Admin Maintenance Bypass**: Master Admins retain full control and are never locked out when Maintenance Mode is active.
            - **OneSignal Push Notifications**: Android system tray notifications even when the app is completely closed.
            - **Direct Cashfree & UPI Payments**: 1-tap intent opening for PhonePe, Paytm, Google Pay, and UPI apps.

            ### 📲 Direct Download:
            👉 **[Download BEASTz-BATTLE-v2.5.apk](https://github.com/bnoorshaikh99887-alt/BEASTz-BATTLE/releases/download/v2.5/BEASTz-BATTLE-v2.5.apk)**
          files: |
            BEASTz-BATTLE-v2.5.apk
            BEASTz-BATTLE.apk
            android-app/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Also Update Latest Tag Release
        uses: softprops/action-gh-release@v1
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "BEASTz BATTLE Latest APK (v2.5)"
          body: "Official latest Android APK (v2.5) for BEASTz BATTLE with Pull-to-Refresh, Blue Gaming Theme, and Admin Maintenance Bypass."
          files: |
            BEASTz-BATTLE-v2.5.apk
            BEASTz-BATTLE.apk
            android-app/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
