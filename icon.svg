<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ca8a04" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="102" fill="none" stroke="url(#yellowGrad)" stroke-width="8" opacity="0.9"/>

  <!-- Inner Hexagonal Shield -->
  <polygon points="256,60 410,135 410,310 256,430 102,310 102,135" fill="#1e293b" stroke="url(#yellowGrad)" stroke-width="12" stroke-linejoin="round"/>
  <polygon points="256,80 390,145 390,300 256,405 122,300 122,145" fill="url(#goldGlow)"/>

  <!-- Gamepad / Trophy Emblem -->
  <!-- Controller body -->
  <path d="M170,200 C150,200 135,215 135,240 C135,275 155,335 185,335 C205,335 215,310 230,310 L282,310 C297,310 307,335 327,335 C357,335 377,275 377,240 C377,215 362,200 342,200 L170,200 Z" fill="url(#yellowGrad)" stroke="#0f172a" stroke-width="6"/>

  <!-- D-Pad Left -->
  <rect x="180" y="230" width="12" height="36" rx="3" fill="#0f172a"/>
  <rect x="168" y="242" width="36" height="12" rx="3" fill="#0f172a"/>

  <!-- Action Buttons Right -->
  <circle cx="325" cy="236" r="6" fill="#0f172a"/>
  <circle cx="343" cy="248" r="6" fill="#0f172a"/>
  <circle cx="325" cy="260" r="6" fill="#0f172a"/>
  <circle cx="307" cy="248" r="6" fill="#0f172a"/>

  <!-- Center Gaming Beast Horns / Star -->
  <polygon points="256,225 264,245 285,245 268,257 274,277 256,265 238,277 244,257 227,245 248,245" fill="#0f172a"/>

  <!-- Typography: BEASTz BATTLE -->
  <text x="256" y="468" text-anchor="middle" font-family="'Arial Black', 'Impact', sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="2">BEAST<tspan fill="#facc15">z</tspan> BATTLE</text>
</svg>